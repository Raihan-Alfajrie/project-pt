<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About — Pertamina Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ea2027; --red-strong:#c8141b; --red-soft:rgba(234,32,39,.16);
  --bg:#151113; --panel:#1e1517; --panel-2:#251a1d;
  --border:rgba(234,32,39,.25); --border-soft:rgba(255,255,255,.08);
  --text:#f6f5f4; --text-dim:rgba(246,245,244,.66); --text-faint:rgba(246,245,244,.42);
  font-family:'Inter',system-ui,sans-serif; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f3f1; --panel:#ffffff; --panel-2:#faf7f6;
    --text:#221417; --text-dim:#5c4b4d; --text-faint:#8b7a7c; --border:rgba(234,32,39,.2); --border-soft:rgba(0,0,0,.08);
  }
}
:root[data-theme="dark"]{ --bg:#151113; --panel:#1e1517; --text:#f6f5f4; --text-dim:rgba(246,245,244,.66); --text-faint:rgba(246,245,244,.42); }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
h1,h2{ font-family:'Space Grotesk',sans-serif; letter-spacing:-.01em; margin:0; }
a{ text-decoration:none; color:inherit; }

.topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 32px; padding-top:calc(16px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--border-soft); }
.brand{ display:flex; align-items:center; gap:10px; }
.brand .mark{ width:34px; height:34px; border-radius:9px; background:linear-gradient(155deg,var(--red),var(--red-strong)); display:flex; align-items:center; justify-content:center; font-size:16px; }
.brand .name{ font-weight:700; font-size:14.5px; line-height:1.15; }
.brand .sub{ font-size:10.5px; color:var(--text-faint); }
.pubnav{ display:flex; align-items:center; gap:26px; }
.pubnav a{ font-size:13.5px; font-weight:600; color:var(--text-dim); }
.pubnav a.active{ color:#fff; }
.btn-outline{ padding:9px 17px; border-radius:9px; border:1px solid var(--border); color:var(--text); font-size:13px; font-weight:700; cursor:pointer; background:transparent; font-family:inherit; }
.btn-outline:hover{ border-color:var(--red); }

.center{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
.cs-card{ text-align:center; max-width:420px; }
.cs-icon{ width:76px; height:76px; border-radius:20px; background:var(--red-soft); display:flex; align-items:center; justify-content:center; margin:0 auto 26px; }
.cs-icon svg{ width:34px; height:34px; color:var(--red); }
.cs-card h1{ font-size:30px; margin-bottom:10px; }
.cs-card p{ font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:26px; }
.btn-back{ display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:10px; background:var(--panel); border:1px solid var(--border-soft); color:var(--text); font-size:13px; font-weight:700; }
.btn-back:hover{ border-color:var(--red); }
.btn-back svg{ width:14px; height:14px; }
.footer{ text-align:center; padding:20px; font-size:11px; color:var(--text-faint); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="mark">🛢️</div><div><div class="name">Pertamina</div><div class="sub">Rig Monitoring Zona 4</div></div></div>
  <nav class="pubnav"><a href="https://claude.ai/artifact/EwkrgTTW4cCBA8j69sPU8Z">Home</a><a href="#" class="active">About</a></nav>
  <a class="btn-outline" href="https://claude.ai/artifact/EwkrgTTW4cCBA8j69sPU8Z">Kembali ke Home</a>
</div>

<div class="center">
  <div class="cs-card">
    <div class="cs-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.6-2.3 1.8-2.4 3.4M12 17h.01"/></svg></div>
    <h1>Coming Soon</h1>
    <p>Halaman About sedang disiapkan. Informasi lengkap tentang platform ini akan hadir di sini.</p>
    <a class="btn-back" href="https://claude.ai/artifact/EwkrgTTW4cCBA8j69sPU8Z"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Kembali ke Home</a>
  </div>
</div>
<div class="footer">© 2026 Pertamina Admin Panel — Internal Use Only</div>
</body>
</html>
